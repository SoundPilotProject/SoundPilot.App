<!DOCTYPE html>
<!--
  firebase/web/index.html

  Root of the hosting site. The site only exists for the e-mail links
  (auth-action.html); this page is here so the bare domain does not answer
  with Firebase's 404 page.
-->
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SoundPilot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap"
    rel="stylesheet">
  <style>
    /* The light/dark palette of core/theme/app_colors.dart. */
    :root {
      --background: #E4E7EE;
      --primary: #2F49B7;
      --on-primary: #FFFFFF;
      --text: #000000;
      color-scheme: light dark;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #000000;
        --primary: #F2E38A;
        --on-primary: #000000;
        --text: #FFFFFF;
      }
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      font-weight: 700;
      font-size: 19px;
      line-height: 1.35;
    }

    header {
      background: var(--primary);
      color: var(--on-primary);
      padding: 18px 20px;
    }

    header h1 {
      margin: 0 auto;
      max-width: 520px;
      font-size: 24px;
      font-weight: 800;
      text-align: center;
    }

    main {
      max-width: 520px;
      margin: 0 auto;
      padding: 24px 28px 48px;
    }
  </style>
</head>
<body>
  <header>
    <h1>SoundPilot</h1>
  </header>
  <main>
    <p>
      Diese Seite gehört zur SoundPilot-App. Sie öffnet sich, wenn du auf den
      Link in einer E-Mail von SoundPilot tippst – zum Beispiel, um ein neues
      Passwort festzulegen.
    </p>
    <p>
      Alles andere passiert in der App selbst.
    </p>
  </main>
</body>
</html>
