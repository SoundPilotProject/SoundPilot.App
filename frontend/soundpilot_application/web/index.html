<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- Google Sign-In (web only). google_sign_in_web reads the OAuth web
       client ID from this tag and asserts if it is missing. The value is
       the client_type 3 entry of android/app/google-services.json; an
       OAuth client ID is public by design, it is sent to every visitor.
       NOTE: the tag alone is not enough. The web client also has to list
       the origin it is served from (e.g. http://localhost:5000) under
       Authorized JavaScript origins in the Google Cloud console, and
       flutter run needs a fixed --web-port to match it. See section 3 of
       docs/PROJECT_CONTEXT.md. -->
  <meta name="google-signin-client_id" content="115904987507-ee8j9ar75grcc69e0ov31m4s87foalhb.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="soundpilot_application">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>soundpilot_application</title>
  <link rel="manifest" href="manifest.json">
</head>
