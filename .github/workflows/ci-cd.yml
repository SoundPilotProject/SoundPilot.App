name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege for the GITHUB_TOKEN; no job needs to write to the repo.
permissions:
  contents: read

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend/soundpilot_application

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true

      # NOTE: google-services.json is not created here. analyze and test do
      # not need it; add it back (via env, not inline) once a step runs
      # `flutter build`.
      - name: Install dependencies
        run: flutter pub get

      # Infos are still allowed (deprecations etc.); warnings and errors fail.
      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/functions

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Functions run on Node.js 22 (see firebase/functions/package.json).
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Install Functions Dependencies
        run: npm ci

      - name: Lint Functions
        run: npm run lint

      - name: Build Functions (TypeScript to JS)
        run: npm run build

  # Tests firestore.rules against the Firestore emulator before they are
  # deployed (firebase/rules-tests).
  rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/rules-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/rules-tests/package-lock.json

      # The Firestore emulator is a Java program.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Same version as the deploy job.
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.5.1

      # The emulator jar is downloaded on first use; keep it between runs.
      - name: Cache Firebase emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.5.1

      - name: Install Test Dependencies
        run: npm ci

      - name: Test Firestore Rules
        run: npm test

  deploy:
    needs: [ build_and_test, functions, rules ]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Run deploys one after another; never cancel one that is in progress.
    concurrency:
      group: deploy-main
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Functions run on Node.js 22 (see firebase/functions/package.json).
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      # Pinned to the version that deploys successfully locally. The
      # firebase.tools install script always pulls the latest release.
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.5.1

      - name: Install Functions Dependencies
        working-directory: firebase/functions
        run: npm ci

      - name: Build Functions (TypeScript to JS)
        working-directory: firebase/functions
        run: npm run build

      # Writes the service account key (secret FIREBASE_SERVICE_ACCOUNT) to a
      # temp file and exports GOOGLE_APPLICATION_CREDENTIALS for firebase-tools.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Up to 3 attempts: Google APIs sometimes answer with a temporary 503,
      # which failed a whole deploy before. A deploy only makes Firebase match
      # main, so repeating it is safe.
      - name: Deploy to Firebase
        working-directory: firebase
        run: |
          for attempt in 1 2 3; do
            firebase deploy --only firestore:rules,functions,hosting --non-interactive --debug && exit 0
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Deploy attempt $attempt failed, retrying in 30 s"
              sleep 30
            fi
          done
          echo "::error::Deploy failed after 3 attempts"
          exit 1
