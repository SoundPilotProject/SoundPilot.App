name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege for the GITHUB_TOKEN; no job needs to write to the repo.
permissions:
  contents: read

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend/soundpilot_application

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      # NOTE: google-services.json is not created here. analyze and test do
      # not need it; add it back (via env, not inline) once a step runs
      # `flutter build`.
      - name: Install dependencies
        run: flutter pub get

      # Infos are still allowed (deprecations etc.); warnings and errors fail.
      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/functions

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Functions run on Node.js 22 (see firebase/functions/package.json).
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      - name: Install Functions Dependencies
        run: npm ci

      - name: Lint Functions
        run: npm run lint

      - name: Build Functions (TypeScript to JS)
        run: npm run build

  deploy:
    needs: [ build_and_test, functions ]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Run deploys one after another; never cancel one that is in progress.
    concurrency:
      group: deploy-main
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Functions run on Node.js 22 (see firebase/functions/package.json).
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/functions/package-lock.json

      # Pinned to the version that deploys successfully locally. The
      # firebase.tools install script always pulls the latest release.
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.5.1

      - name: Install Functions Dependencies
        working-directory: firebase/functions
        run: npm ci

      - name: Build Functions (TypeScript to JS)
        working-directory: firebase/functions
        run: npm run build

      # NOTE: Originally a TODO(improve): --token is deprecated in
      # firebase-tools; switch to a service account. Done: the service account
      # key (secret FIREBASE_SERVICE_ACCOUNT) is written to a temp file and
      # exported as GOOGLE_APPLICATION_CREDENTIALS, which firebase-tools uses.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase
        working-directory: firebase
        run: firebase deploy --only firestore:rules,functions --non-interactive --debug
