name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
        working-directory: ./frontend/soundpilot_application

      - name: Install dependencies
        run: flutter pub get
        working-directory: ./frontend/soundpilot_application

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: ./frontend/soundpilot_application
        continue-on-error: true

      - name: Run tests
        run: flutter test
        working-directory: ./frontend/soundpilot_application
        continue-on-error: true

  deploy:
    needs: build_and_test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Functions run on Node.js 22 (see firebase/functions/package.json).
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Pinned to the version that deploys successfully locally. The
      # firebase.tools install script always pulls the latest release.
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.5.1

      - name: Install Functions Dependencies
        working-directory: firebase/functions
        run: npm install

      - name: Build Functions (TypeScript to JS)
        working-directory: firebase/functions
        run: npm run build

      - name: Deploy to Firebase
        working-directory: firebase
        run: firebase deploy --only firestore:rules,functions --non-interactive --debug
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
